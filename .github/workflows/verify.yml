name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Check maintenance scripts
        run: |
          node --check scripts/import-openalternative-candidates.mjs
          node --check scripts/review-import-candidate.mjs
          node --check scripts/sync-github-snapshots.mjs
          node --check scripts/generate-readme.mjs
          node --check scripts/generate-openalternative-catalog.mjs
      - run: npm run build
