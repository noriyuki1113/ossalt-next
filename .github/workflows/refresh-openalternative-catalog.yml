name: Refresh OpenAlternative catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate-openalternative-catalog.mjs"
      - ".github/workflows/refresh-openalternative-catalog.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run generate:openalternative-catalog
      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- docs/openalternative-catalog.md; then
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openalternative-catalog.md
          git commit -m "docs: refresh OpenAlternative candidate catalog [skip ci]"
          git push
